<title>Wealth Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a private-banking app. Slim glass top bar with pill nav; Summary opens on a bento hero (big serif figure + cumulative curve)
   then four quiet chapters: the year so far, what drives it, where it's heading, what to do. Near-black with one warm gold signal. */
:root{
  --bg:#060607; --top:rgba(10,10,12,.78); --s1:#111113; --s2:#18181b; --s3:#1f1f23; --line:rgba(255,255,255,.065); --line2:rgba(255,255,255,.11);
  --fg:#f4f2ee; --muted:#8e8c93; --faint:#55545b;
  --gold:#e8c27a; --gold2:#b8914d;
  --d:#8fb0ff; --i:#6fe0c4; --p:#bba4ff; --x:#e8c27a;
  --good:#5fd69a; --bad:#ff7a73; --warn:#f0b65a;
  --g1:#5ccdb7; --g2:#e9b864; --g3:#b39af7; --g4:#7aa6f5; --g5:#f08a6c; --g6:#a9c86e;
  --land:#17171a; --land-line:#2a2a2f;
  --hero:radial-gradient(120% 120% at 0% 0%,#2a2416 0%,#141312 45%,#0f0f11 100%);
  --f:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --m:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f1ee; --top:rgba(248,247,244,.82); --s1:#ffffff; --s2:#f5f4f1; --s3:#ecebe7; --line:rgba(20,18,14,.08); --line2:rgba(20,18,14,.14);
  --fg:#141310; --muted:#6c6a66; --faint:#b3b0aa; --gold:#9c7426; --gold2:#7d5c1c;
  --d:#3a64d8; --i:#0f9a7e; --p:#6a4fd6; --x:#9c7426; --good:#1d8f55; --bad:#d23f36; --warn:#b97a10;
  --g1:#1f9c86; --g2:#c98a1c; --g3:#7d5ed4; --g4:#3d78d4; --g5:#d4603f; --g6:#6f9330;
  --land:#ebe9e4; --land-line:#d2cfc8; --hero:radial-gradient(120% 120% at 0% 0%,#f6ead0 0%,#fbf8f1 50%,#ffffff 100%); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f1ee; --top:rgba(248,247,244,.82); --s1:#ffffff; --s2:#f5f4f1; --s3:#ecebe7; --line:rgba(20,18,14,.08); --line2:rgba(20,18,14,.14);
  --fg:#141310; --muted:#6c6a66; --faint:#b3b0aa; --gold:#9c7426; --gold2:#7d5c1c;
  --d:#3a64d8; --i:#0f9a7e; --p:#6a4fd6; --x:#9c7426; --good:#1d8f55; --bad:#d23f36; --warn:#b97a10;
  --g1:#1f9c86; --g2:#c98a1c; --g3:#7d5ed4; --g4:#3d78d4; --g5:#d4603f; --g6:#6f9330;
  --land:#ebe9e4; --land-line:#d2cfc8; --hero:radial-gradient(120% 120% at 0% 0%,#f6ead0 0%,#fbf8f1 50%,#ffffff 100%); color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--top);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--gold),var(--gold2));display:grid;place-items:center;font:italic 17px/1 var(--serif);color:#151006}
.logo b{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;margin-inline:auto;min-width:0}
.nv{font:600 12.5px var(--f);color:var(--muted);background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nv svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nv:hover{color:var(--fg)}
.nv[aria-selected="true"]{color:var(--bg);background:var(--fg)}
.topr{display:flex;align-items:center;gap:10px;flex:none}
.src{font-size:11.5px;color:var(--muted);white-space:nowrap}
.src b{color:var(--fg);font-weight:600}
@media (max-width:1100px){.src{display:none}.nv svg{display:none}}
@media (max-width:760px){.topin{flex-wrap:wrap;gap:8px}.logo{order:1}.topr{order:2;margin-left:auto}nav{order:3;width:100%;margin:0}}
.btn{font:600 12px var(--f);border:1px solid var(--line2);background:var(--s2);color:var(--fg);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(140deg,var(--gold),var(--gold2));color:#151006;border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.content{padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1280px;margin:0 auto;display:grid;gap:12px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding:4px 2px 2px}
.pagehead h1{font:400 32px/1.05 var(--serif);letter-spacing:-.01em;margin:0}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:72ch;font-size:13px}
.pn{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.pn h2{font-weight:700;font-size:14px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.pn .sub{color:var(--muted);font-size:12px;margin:2px 0 12px;max-width:72ch}
.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between}
.ph>div:first-child{min-width:0;flex:1 1 240px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.g21{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.65fr);gap:12px}
@media (max-width:1060px){.g21,.g12{grid-template-columns:minmax(0,1fr)}}
.band{display:grid;gap:12px;margin-top:14px}
.bh{display:flex;align-items:baseline;gap:12px;padding:0 2px}
.bh h2{margin:0;font:400 24px/1.1 var(--serif);letter-spacing:-.005em}
.bh p{margin:0;color:var(--muted);font-size:12.5px}
.bh .rule{flex:1;height:1px;background:var(--line);min-width:20px;align-self:center}
/* hero bento */
.bento{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,1fr);grid-auto-rows:minmax(0,auto);gap:12px}
.bento .hero{grid-row:span 2;background:var(--hero);border:1px solid color-mix(in srgb,var(--gold) 22%,var(--line));border-radius:22px;padding:18px 20px 12px;display:grid;gap:4px;min-width:0}
@media (max-width:1060px){.bento{grid-template-columns:1fr 1fr}.bento .hero{grid-column:1/-1;grid-row:auto}}
.big{font:400 clamp(44px,6vw,64px)/1 var(--serif);letter-spacing:-.02em}
.big small{font-size:.5em;color:var(--muted);margin-left:2px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.kc{display:inline-flex;gap:6px;align-items:baseline;background:color-mix(in srgb,var(--fg) 6%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.kc b{color:var(--fg);font-weight:700}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:3px;align-content:start;min-width:0;position:relative;overflow:hidden}
.tile .v{font-weight:700;font-size:24px;letter-spacing:-.025em;white-space:nowrap}
.tile .s{font-size:12px;color:var(--muted)}
.ring{position:absolute;right:12px;top:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mt{background:var(--s1);padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
.lb{font:700 10px var(--f);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.mt .v{font-weight:700;font-size:21px;letter-spacing:-.025em;white-space:nowrap}
.mt .s{font-size:11.5px;color:var(--muted)}
.mt .s b{font-weight:700}
.up{color:var(--bad)} .dn{color:var(--good)} .wn{color:var(--warn)}
.spark{height:22px;margin-top:2px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex:none}
.seg button{font:600 11.5px var(--f);border:0;background:none;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],input[type=number],input[type=text]{font:500 12.5px var(--f);background:var(--s2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
input[type=search],.ask input{min-width:0;flex:1 1 220px}
.tag{font:700 9.5px var(--f);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--s2);color:var(--muted);white-space:nowrap}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.tag.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.tag.info{color:var(--d);background:color-mix(in srgb,var(--d) 13%,transparent)}
.tag.p{color:var(--p);background:color-mix(in srgb,var(--p) 13%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.cd{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:grid;gap:5px;align-content:start}
.ai .cd{background:var(--s2)}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.cards.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards.c3{grid-template-columns:minmax(0,1fr)}}
.cd h3{margin:0;font-size:13.5px;font-weight:700;line-height:1.35;letter-spacing:-.005em;text-wrap:balance}
.cd p{margin:0;color:var(--muted);font-size:12px}
.cd .act{font-size:12px;border-top:1px solid var(--line);padding-top:7px;margin-top:2px}
.cd .row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px}
.imp{font-weight:700;font-size:14px;color:var(--good);white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font:700 9.5px var(--f);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--s1);z-index:1}
th.sort{cursor:pointer} th.sort:hover{color:var(--fg)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-weight:500}
tbody tr:hover td{background:var(--s2)}
.tsc{max-height:560px;overflow:auto}
.pill{display:inline-block;font:600 10px var(--f);padding:2px 7px;border-radius:999px;background:var(--s2);color:var(--muted);white-space:nowrap}
.pill.due{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.pill.split{color:var(--d);background:color-mix(in srgb,var(--d) 13%,transparent)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.muted{color:var(--muted)} .foot{font-size:11.5px;color:var(--muted)}
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(80px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.br .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .trk{display:block;height:6px;background:var(--s2);border-radius:3px;position:relative}
.br .fil{display:block;height:100%;border-radius:3px;background:var(--d)}
.br .mark{display:block;position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--fg)}
.br .val{font-weight:600;text-align:right;min-width:70px;white-space:nowrap}
.br .val small{color:var(--muted);font-size:10.5px;margin-left:5px;font-weight:500}
.br.click{cursor:pointer} .br.click:hover .lab{color:var(--gold)}
.dv{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12.5px;cursor:pointer}
.dv:hover .lab{color:var(--gold)}
.dv .ax{display:block;position:relative;height:14px}
.dv .ax::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.dv .b{display:block;position:absolute;top:3px;height:8px;border-radius:4px}
svg{display:block;max-width:100%}
svg text{fill:var(--muted);font-family:var(--f);font-size:10.5px;font-weight:500}
svg .lbl{fill:var(--fg);font-size:12px;font-weight:600}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.tip{position:fixed;pointer-events:none;z-index:30;background:var(--s3);color:var(--fg);border:1px solid var(--line2);font-size:12px;padding:7px 10px;border-radius:10px;max-width:260px;line-height:1.45;box-shadow:0 16px 40px -12px rgba(0,0,0,.6)}
.tip b{font-weight:700}
.donut{display:grid;grid-template-columns:124px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:480px){.donut{grid-template-columns:minmax(0,1fr)}.donut svg{margin:auto}}
.hm{border-collapse:separate;border-spacing:2px;width:100%;font-size:11.5px}
.hm th{position:static;background:none;border:0;padding:2px 4px;text-align:center}
.hm td{border:0;padding:0 2px;height:25px;border-radius:6px;text-align:center;font-size:10.5px;font-weight:600;cursor:pointer;min-width:44px}
.hm td.rl{text-align:left;font-size:12.5px;font-weight:500;padding-right:10px;white-space:nowrap;cursor:default;background:none!important}
.hm td.tot{font-size:12px;text-align:right;padding-left:10px;cursor:default;background:none!important;white-space:nowrap}
.hm td[data-c]:hover{outline:1px solid var(--fg)}
.hm tbody tr:hover td{background:inherit}
.scale{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:8px}
.scale i{height:6px;width:120px;border-radius:3px;display:inline-block}
.sim{display:grid;gap:10px}
.lever{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) 96px;gap:12px;align-items:center;font-size:12.5px}
.lever label{font-weight:600}
.lever input[type=range]{width:100%;accent-color:var(--gold)}
.lever .o{font-weight:700;text-align:right;white-space:nowrap}
.lever .o small{display:block;color:var(--muted);font-size:10.5px;font-weight:500}
@media (max-width:560px){.lever{grid-template-columns:minmax(0,1fr) 90px}.lever input{grid-column:1/-1;grid-row:2}}
.outcome{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.meter{display:block;height:8px;background:var(--s2);border-radius:4px;position:relative;margin-top:6px}
.meter span{display:block;position:absolute;inset:0 auto 0 0;border-radius:4px}
.ai{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 55%),var(--s1);border-color:color-mix(in srgb,var(--gold) 20%,var(--line))}
.ask{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.answer{white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:12px;max-width:84ch;border-left:2px solid var(--gold);padding-left:12px}
.answer:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:500 11.5px var(--f);border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--gold)}
.trip .stack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--s2);gap:2px}
.trip.sel{border-color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.pinwrap{min-height:calc(100vh - 150px);display:grid;place-items:center}
.pin{display:grid;justify-items:center;gap:30px}
.dots{display:flex;gap:14px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);transition:background .12s,border-color .12s}
.dots i.on{background:var(--fg);border-color:var(--fg)}
.pin.busy .dots{animation:pulse .8s ease-in-out infinite alternate}
.pin.err .dots{animation:shake .4s}
.pin.err .dots i{border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pulse{to{opacity:.35}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.keys button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line2);background:var(--s2);color:var(--fg);font:500 28px var(--f);cursor:pointer;transition:transform .08s,background .12s}
.keys button:hover{background:var(--s1)}
.keys button:active{transform:scale(.93)}
.keys .del{border-color:transparent;background:none;font-size:22px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pin.err .dots,.pin.busy .dots{animation:none}}
@media (max-width:560px){.mt .v,.tile .v{font-size:19px}.hide-sm{display:none}.pn{padding:13px 14px}.pagehead h1{font-size:28px}}
</style>

<header class="top"><div class="topin">
  <div class="logo"><div class="mk">W</div><b>Wealth Manager</b></div>
  <nav role="tablist" id="tabs"></nav>
  <div class="topr"><span class="src" id="src"></span><label class="btn" for="file" title="Read a newer copy of the tracker. It stays in your browser.">Load workbook</label><input type="file" id="file" accept=".xlsx,.xlsm" hidden></div>
</div></header>
<div class="content"><div class="inner" id="main"></div></div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SEED = __DATA__;
const MAP = __MAP__;
const VAULT = __VAULT__;
let D;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SPEND_TYPES=new Set(['Lifestyle','Recurring Fixed']);
const ONE_OFF=40000;
const GROUPS=[
  ['Home & bills','--g1',['Rent & Utilities','Subscriptions','Family','Home Loan']],
  ['Food','--g2',['Grocery','Food Orders','Food & Drinks','Alcohol']],
  ['Lifestyle','--g3',['Shopping','Personal','Gaming','Others','Medicine','Splitwise Bills','Cash','Loan - Lent']],
  ['Travel & trips','--g4',['Travel','Trip','Fuel']],
  ['Big one-offs','--g5',['Wedding']],

function normalise(data){
  data.log.forEach(x=>{
    if(x.c==='Wedding Expense')x.c='Wedding'; if(x.c==='lif')x.c='Others';
    x.mi=+x.d.slice(5,7)-1; x.spend=SPEND_TYPES.has(x.t); x.grp=groupOf(x.c); x.dw=dayIdx(x.d);
    x.one=x.spend&&(x.grp==='Big one-offs'||x.s>=ONE_OFF);
  });
  data.log.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.a-a.a);
  data.months=[...new Set(data.log.map(x=>x.mi))].sort((a,b)=>a-b);
  data.asof=data.log.map(x=>x.d).sort().pop();
  const ad=new Date(data.asof+'T00:00:00');
  data.year=ad.getFullYear(); data.lastM=ad.getMonth(); data.dom=ad.getDate(); data.dim=new Date(ad.getFullYear(),ad.getMonth()+1,0).getDate();
  data.partial=data.dom<data.dim;
  data.complete=data.months.filter(i=>!(data.partial&&i===data.lastM));
  if(!data.complete.length)data.complete=data.months.slice();
  data.sp=data.log.filter(x=>x.spend);
  data.cats=group(data.sp,'c',x=>x.s).map(c=>c[0]);
  return data;
}

/* ---------- prediction ---------- */
function forecast(){
  const core=D.sp.filter(x=>!x.one),C=D.complete,last3=C.slice(-3),last6=C.slice(-6);
  const coreM=i=>mTot(core,i);
  const base=median(last3.map(coreM)),lo=Math.min(...last6.map(coreM)),hi=Math.max(...last6.map(coreM));
  const cur=D.sp.filter(x=>x.mi===D.lastM),toDate=sum(cur,x=>x.s);
  let proj=toDate,pLo=toDate,pHi=toDate;
  if(D.partial){
    const left=D.dim-D.dom;
    const rateNow=sum(cur.filter(x=>x.t==='Lifestyle'&&!x.one),x=>x.s)/D.dom;
    const rates=last6.map(i=>sum(core.filter(x=>x.mi===i&&x.t==='Lifestyle'),x=>x.s)/new Date(D.year,i+1,0).getDate());
    const rate=.5*rateNow+.5*median(rates);
    proj=toDate+rate*left;pLo=toDate+Math.min(...rates,rateNow)*left;pHi=toDate+Math.max(...rates,rateNow)*left;
  }
  const rest=[];for(let i=D.lastM+1;i<12;i++)rest.push(i);
  const ytd=sum(D.sp,x=>x.s),yearEnd=ytd+(proj-toDate)+base*rest.length;
  const typicalOver=C.filter(i=>coreM(i)>S.cap).length;
  const prev3=C.slice(-6,-3);
  const catF=D.cats.map(c=>{const r=core.filter(x=>x.c===c);const f=median(last3.map(i=>mTot(r,i)));const l=last3.reduce((a,i)=>a+mTot(r,i),0)/last3.length;const p=prev3.length?prev3.reduce((a,i)=>a+mTot(r,i),0)/prev3.length:l;return {c,f,l,p,trend:p?l/p-1:(l?9:0)}}).filter(x=>x.f>0||x.l>0).sort((a,b)=>b.f-a.f);
  const lastFull=C[C.length-1];
  const rec=D.log.filter(x=>x.rc&&x.mi===lastFull&&x.spend);
  return {base,lo,hi,toDate,proj,pLo,pHi,rest,yearEnd,ytd,typicalOver,catF,recG:group(rec,'ds',x=>x.s),recT:sum(rec,x=>x.s),coreM,last3,lastFull};
}

async function openVault(pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

  const gap=F.base-S.cap;
  if(gap>0)out.push({tone:'bad',k:'Close the gap',h:`A typical month runs ${short(gap)} over your cap`,p:`Typical ${short(F.base)} against ${short(S.cap)}. The planner shows which cuts get you there.`,a:`Find ${short(gap)} a month in cuts, or reset the cap to ${short(Math.ceil(F.base/5000)*5000)} so it matches reality.`});
  if(D.partial&&F.proj>S.cap){const left=D.dim-D.dom;out.push({tone:'warn',k:MONTHS[D.lastM],h:F.toDate>S.cap?`${MONTHS[D.lastM]} is already ${short(F.toDate-S.cap)} over`:`${MONTHS[D.lastM]} is heading for ${short(F.proj)}`,p:`${left} days left. Likely finish ${short(F.pLo)} – ${short(F.pHi)}.`,a:F.toDate>S.cap?'Keep the rest of the month to essentials to limit the overshoot.':`Keep the remaining days under ${short(S.cap-F.toDate)}.`})}
  const del=m3(x=>x.c==='Food Orders');if(del)out.push({tone:'warn',k:'Delivery',h:`Food delivery costs ${short(del)} a month`,p:`${r3(x=>x.c==='Food Orders').length} orders in the last three months, with a cook already paid for.`,a:'Cap delivery at two orders a week.',save:del*.3});
  const qc=m3(x=>/instamart|blinkit|zepto|flipkart minutes/i.test(x.ds));if(qc)out.push({tone:'info',k:'Top-ups',h:`Quick-commerce top-ups add ${short(qc)} a month`,p:`${Math.round(r3(x=>/instamart|blinkit|zepto|flipkart minutes/i.test(x.ds)).length/last3.length)} small orders a month.`,a:'Switch to one planned weekly grocery order.',save:qc*.2});
  const sh=m3(x=>x.c==='Shopping');if(sh)out.push({tone:'info',k:'Shopping',h:`Shopping averages ${short(sh)} a month`,p:'Your plan allows ₹8k for shopping and misc together.',a:'Wait 48 hours before any non-essential order over ₹2k.',save:sh*.3});
  const subs=r3(x=>x.c==='Subscriptions');if(subs.length){const v=sum(subs,x=>x.s)/last3.length;out.push({tone:'info',k:'Subscriptions',h:`${new Set(subs.map(x=>x.ds)).size} subscriptions cost ${short(v)} a month`,p:`${short(v*12)} a year at this rate.`,a:'Cancel anything you have not opened in the last month.',save:v*.25})}
  const due=D.log.filter(x=>x.st==='Due');if(due.length){const b=group(due,'b',x=>x.a)[0];out.push({tone:'bad',k:'Dues',h:`Pay off ${short(sum(due,x=>x.a))} marked Due`,p:`${due.length} entries, mostly on ${b[0]}.`,a:'Settle before the statement date; card interest outweighs any reward.'})}
  return out.slice(0,6);
}
function wireSim(L,F){
  const upd=()=>{let cut=0;L.forEach(l=>{const p=S.lev[l.k]||0,s=l.v*p/100;cut+=s;const o=$('#lo-'+l.k);if(o)o.innerHTML=`${p?'−'+short(s):'—'}<small>${p}% cut</small>`});
    store.set('lev',S.lev);
    const nw=F.base-cut,gap=nw-S.cap,mx=Math.max(F.base,S.cap)*1.12;
    $('#simOut').innerHTML=`<div class="outcome"><div><div class="lb">Monthly saving</div><div style="font-weight:700;font-size:28px;color:var(--good);letter-spacing:-.03em">${short(cut)}</div><div class="foot">${short(cut*12)} a year</div></div>
      <div><div class="lb">New typical month</div><div style="font-weight:700;font-size:28px;color:${gap>0?'var(--warn)':'var(--good)'};letter-spacing:-.03em">${short(nw)}</div><div class="foot">${gap>0?short(gap)+' still over cap':short(-gap)+' under cap'}</div></div></div>
      <div style="margin-top:20px"><div class="lb">Before → after</div><div class="meter" style="height:12px;margin-top:10px"><span style="width:${F.base/mx*100}%;background:var(--faint);opacity:.45"></span><span style="width:${nw/mx*100}%;background:${gap>0?'var(--warn)':'var(--good)'}"></span><span style="left:${S.cap/mx*100}%;width:2px;top:-5px;bottom:-5px;background:var(--bad)" data-tip="Cap ${inr(S.cap)}"></span></div>
      <p class="foot" style="margin-top:12px">${cut?`Through December this saves ${short(cut*F.rest.length)}, bringing the year to about ${short(F.yearEnd-cut*F.rest.length)}.`:'Move a slider, or start from the suggested plan.'}</p></div>`};
  document.querySelectorAll('.sim input[type=range]').forEach(r=>r.oninput=()=>{S.lev[r.dataset.k]=+r.value;upd()});
  $('#levSug').onclick=()=>{L.forEach(l=>{S.lev[l.k]=l.sug;$('#lv-'+l.k).value=l.sug});upd()};
  $('#levReset').onclick=()=>{L.forEach(l=>{S.lev[l.k]=0;$('#lv-'+l.k).value=0});upd()};
  upd();
}
function wireAI(m){
  const rec=m.querySelector('#recBtn'),ask=m.querySelector('#askBtn'),stop=m.querySelector('#stopBtn'),ans=m.querySelector('#ans'),q=m.querySelector('#q'),recs=m.querySelector('#recs');
  if(!rec)return;
  const show=list=>{recs.innerHTML=list.map(r=>`<div class="cd"><div class="row"><span class="tag ${r.area==='save'?'good':r.area==='risk'?'bad':'p'}">${esc(r.area||'idea')}</span>${+r.monthly_saving?`<span class="imp">−${short(+r.monthly_saving)}<span class="muted" style="font-size:11px">/mo</span></span>`:''}</div><h3>${esc(r.title)}</h3><p>${esc(r.detail)}</p>${r.first_step?`<div class="act">${esc(r.first_step)}</div>`:''}</div>`).join('')};
  if(S.recs)show(S.recs);
  rec.onclick=async()=>{rec.disabled=true;rec.textContent='Thinking…';recs.innerHTML='<p class="muted">Claude is reading your ledger. This can take up to a minute.</p>';
    try{const out=await SAMPLE.json(`You are a sharp, practical personal-finance coach in India. Using only the data below, give exactly 5 recommendations for Raj that together bring his typical month toward the cap. Ground each in his numbers. Prefer actions he can start this week; include at most one about risk (unpaid dues, concentration). No specific stocks or funds.
Reply with only a JSON array of 5 objects: {"title": short headline, "detail": 1-2 sentences citing his numbers, "area": "save" | "risk" | "habit", "monthly_saving": rupees per month as a number or 0, "first_step": one concrete action}.

${aiContext()}`,{cache:{gcTime:6*3600e3}});
      S.recs=(Array.isArray(out)?out:[]).filter(r=>r&&r.title).slice(0,5);show(S.recs);if(!S.recs.length)recs.innerHTML='<p class="muted">Claude did not return a plan. Try again.</p>';
    }catch(e){recs.innerHTML=`<p class="muted">${esc(aiErr(e))}</p>`;if(['not_granted','sampling_disabled'].includes(e.code))m.querySelector('[data-ai]').hidden=true}
    finally{rec.disabled=false;rec.textContent='Refresh plan'}};
  const askIt=async text=>{if(!text.trim())return;aiCtl?.abort();aiCtl=new AbortController();ask.disabled=true;stop.hidden=false;ans.textContent='Thinking…';
    try{const opts={signal:aiCtl.signal,cache:false,onText:({text})=>{ans.textContent=text}};if(aiTools)opts.tools=AI_TOOLS;
      const r=await SAMPLE(`You are a plain-spoken personal-finance analyst. Answer Raj's question from the ledger summary below${aiTools?', calling search_transactions when you need individual rows':''}. Use rupee amounts. Under 180 words. Plain text, short lines or simple dashes, no markdown headings. If the data cannot answer it, say so.

${aiContext()}

Question: ${text}`,opts);
      if(r.truncated)ans.textContent+='\n\n(Cut short. Ask something narrower.)';
    }catch(e){ans.textContent=e.code==='cancelled'?(e.text||''):(e.text?e.text+'\n\n':'')+aiErr(e)}
    finally{ask.disabled=false;stop.hidden=true}};
  ask.onclick=()=>askIt(q.value);q.onkeydown=e=>{if(e.key==='Enter')askIt(q.value)};stop.onclick=()=>aiCtl?.abort();
  m.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.textContent;askIt(c.textContent)});
}

function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const rows=(name,skip)=>{const ws=wb.Sheets[name];if(!ws)return [];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}).slice(skip)};
  const iso=v=>v instanceof Date?new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10):(v?String(v).slice(0,10):null);
  const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
  const log=rows('Log',2).filter(r=>r[0] instanceof Date).map(r=>{const a=n(r[2]),sp=r[10]==='Yes',g=Math.max(1,parseInt(r[11])||1),s=sp?Math.round(a/g*100)/100:a;
    return {d:iso(r[0]),ds:String(r[1]||''),a,c:r[3]||'Uncategorised',t:r[4]||'',m:r[5]||'',rc:r[6]==='Yes',p:r[7]||'',b:r[8]||'',sp,g,s,rv:sp?Math.round((a-s)*100)/100:0,pp:r[14]||'',tr:r[15]||'',lp:r[16]||'',la:n(r[17]),rt:r[18]||'',nt:String(r[19]||''),st:r[22]||''}});
  if(!log.length)throw new Error('No dated rows found on a sheet called "Log".');
  const home=rows('Home Construction',1).filter(r=>r[0]).map(r=>({d:iso(r[0]),h:r[1],ds:String(r[2]||''),q:n(r[3]),rate:n(r[4]),u:r[5],a:n(r[8]),pd:n(r[9]),pe:n(r[10]),c:r[11]||'Other',f:r[12],st:r[13]}));
  const budget=rows('Budget vs Actual',3).filter(r=>r[0]&&r[0]!=='Total Fixed Spends'&&typeof r[1]==='number').map(r=>({i:r[0],a:r[1],t:r[2]}));
  const loans=rows('Loan Tracker',2).filter(r=>r[0]&&r[0]!=='TOTAL OUTSTANDING').map(r=>({p:r[0],ds:r[1],d:iso(r[2]),a:n(r[3]),r:n(r[5]),st:r[7]}));
  return {log,home,budget:budget.length?budget:D.budget,loans:loans.length?loans:D.loans,inv:D.inv};
}
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{D=normalise(parseWorkbook(await f.arrayBuffer()));S.unlocked=true;S.hidden=0;S.month=null;S.recs=null;setSrc(f.name);render();toast(`Loaded ${D.log.length} transactions from ${f.name}`)}
  catch(err){toast('Could not read that file. '+(err.message||'Check it is the tracker workbook.'))}
  e.target.value=''};
function setSrc(name){$('#src').innerHTML=`<b>${D.log.length+S.hidden}</b> entries · to <b>${fmtD(D.asof)}</b>`;$('#src').title=name||'Raj_NewTracker_2026.xlsm'}

D=normalise(SEED);setSrc();render();
